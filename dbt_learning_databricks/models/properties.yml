version: 2

models:
  - name: fact_sales
    description: "Bronze layer model properties."
    # Generic test for the Transaction Id column to ensure it is not null and unique.
    columns:
      - name: "Transaction Id"
        quote: true
        description: "The unique identifier for each transaction."
        data_tests:
          - not_null
          - unique
    #Product Category column to ensure that the values are within the accepted values.
      - name: "Product Category"
        quote: true
        description: "The category of the product involved in the transaction."
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - 'Electronics'
                  - 'Office Supplies'